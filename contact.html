<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakta oss</title> 
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
  <div class="box">
    <div class="namn">Gulmira & Rubens Hundpassning</div>
    <a class="knapp" href="index.html">Se vårt utbud</a>
  </div>
</header>
    <!-- Huvudinnehåll -->
    <main>
        <section id="form">
            <h1>Kontakta oss</h1>
            <p>Har du frågor om hundpassning eller hundpromenader? Kontakta oss gärna.</p>
            <!-- Kontaktformulär -->
        <form>
            <label for="name">Namn:</label>
            <input type="text" id="name" name="name">

            <label for="email">E-post:</label>
            <input type="email" id="email" name="email">
           
            <label for="message">Meddelande:</label>
            <textarea id="message" name="message"></textarea>
            <button type="submit">Skicka</button>
        </form>
            
        </section>
        <section id="hundbild">
            <img src="https://www.farmerpetes.com.au/cdn/shop/articles/Happy_Lab.jpg?v=1684406977" alt="Glad hund som väntar på promenad" width="70%" height="auto">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRtrD-cctracs6abQQ0yxMvfDdZRGDdX_Vbb7oMdRxs-dCW7WbxWWnZ8p0&s=10" alt="Hund ute på promenad" width="70%" height="auto">
        </section>
    </main>
    <!-- Sidfot -->
<footer>
  <div class="box">
    <span>© 2026 Gulmira &amp; Rubens Hundpassning</span>
    <a href="index.html">Utbud</a>
  </div>
</footer>
</body>
</html>
